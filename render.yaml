# Render deployment for the Tessora Beauty shop.
# Render reads this file automatically when you create a Blueprint from the repo.
services:
  - type: web
    name: tessora-beauty
    runtime: node
    plan: free
    buildCommand: "" # nothing to build - the shop has no dependencies
    startCommand: npm run start:render
    envVars:
      - key: NODE_VERSION
        value: "20"

    # ---------------------------------------------------------------------
    # IMPORTANT - saving your products permanently
    #
    # On the free plan Render gives the shop no permanent storage, so every
    # product, photo and order you add is wiped whenever the service restarts
    # (which happens after ~15 minutes of no visitors, and on every deploy).
    # That is fine for showing people the shop. It is NOT fine for real selling.
    #
    # To keep your data: switch the service to a paid instance type in the Render
    # dashboard (disks are not offered on Free), then uncomment the four lines
    # below and deploy again. The `data` folder
    # (your database and all uploaded product photos) then lives on a real disk
    # that survives restarts.
    #
    # disk:
    #   name: tessora-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
