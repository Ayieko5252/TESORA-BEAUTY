<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Tessora Beauty monogram">
  <defs>
    <linearGradient id="tbGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8cd7a"/>
      <stop offset="38%" stop-color="#c9a227"/>
      <stop offset="62%" stop-color="#f4e3ad"/>
      <stop offset="100%" stop-color="#b8901c"/>
    </linearGradient>
    <linearGradient id="tbBlush" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7c9d3"/>
      <stop offset="100%" stop-color="#e39fae"/>
    </linearGradient>
  </defs>

  <!-- crown -->
  <path d="M74 40 L84 22 L94 36 L104 16 L114 36 L124 22 L134 40 Z"
        fill="url(#tbGold)"/>
  <circle cx="84" cy="20" r="3.4" fill="url(#tbGold)"/>
  <circle cx="104" cy="14" r="3.8" fill="url(#tbGold)"/>
  <circle cx="124" cy="20" r="3.4" fill="url(#tbGold)"/>

  <!-- T monogram -->
  <rect x="50" y="52" width="104" height="17" rx="3" fill="url(#tbGold)"/>
  <rect x="92" y="52" width="20" height="112" rx="3" fill="url(#tbGold)"/>
  <path d="M78 164 q24 12 48 0" stroke="url(#tbGold)" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <!-- feminine profile silhouette -->
  <path d="M128 74 q16 6 20 24 q3 14 -6 24 q-4 5 -3 11 q1 5 -4 6 l-9 2 q-5 1 -5 -4
           l0 -10 q-9 -3 -9 -13 q0 -8 5 -14 q-2 -14 11 -26 z"
        fill="url(#tbBlush)" opacity=".95"/>
  <path d="M139 106 q6 -2 10 1" stroke="#12100f" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M146 122 q5 2 9 -1" stroke="#b8536c" stroke-width="2.2" fill="none" stroke-linecap="round"/>
</svg>
