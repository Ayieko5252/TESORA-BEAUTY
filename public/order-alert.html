<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order alerts · Tessora Beauty</title>
<meta name="robots" content="noindex">
</head>
<body>
<!--
  This page is never shown to anyone. It exists so Netlify registers the
  "order-alert" form when the site is deployed.

  When a customer places an order, the API (netlify/functions/api.mjs,
  alertNewOrder) submits the order into this form, and Netlify's form
  notification emails the submission to the store's inbox. That is the whole
  order-email pipeline — no email service or API key involved.

  Every field the API sends must be listed here, or Netlify drops it.
-->
<form name="order-alert" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field">
  <input name="Order">
  <input name="Total">
  <input name="Customer">
  <input name="Phone">
  <input name="Email">
  <input name="Deliver_to">
  <textarea name="Items"></textarea>
  <input name="Delivery">
  <input name="Payment">
  <textarea name="Notes"></textarea>
  <input name="Placed">
  <input name="Manage">
</form>
</body>
</html>
